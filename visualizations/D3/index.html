<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Enterprise WSDL Explorer</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>

  <header class="topbar">
    <div class="brand">
      <h1>Enterprise WSDL Explorer</h1>
      <p id="meta" class="meta">No file loaded</p>
    </div>
    <nav id="tabs" aria-label="Views"></nav>
    <div class="actions">
      <button id="load-btn" class="btn" type="button">Load file…</button>
      <input id="file-input" type="file" accept=".wsdl,.xml,.json" hidden>
      <input id="desc-input" type="file" accept=".csv,.json" hidden>
      <button id="theme-btn" class="btn" type="button" title="Cycle theme: auto, light, dark">Theme: auto</button>
    </div>
  </header>

  <main id="main" tabindex="-1"></main>
  <div id="tooltip" role="tooltip" hidden></div>

  <script src="vendor/d3.min.js"></script>
  <script src="js/util.js"></script>
  <script src="js/parser.js"></script>
  <script src="js/model.js"></script>
  <script src="js/descriptions.js"></script>
  <script src="js/charts.js"></script>
  <script src="js/views.js"></script>
  <script src="js/orgs.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
